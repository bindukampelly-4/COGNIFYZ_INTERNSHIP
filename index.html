<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
        }

        nav {
            background-color: navy;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        .container {
            padding: 20px;
        }

        img {
            width: 200px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: navy;
            color: white;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="container" id="home">
        <h1>Welcome to My Webpage</h1>

        <p>
            Hello! I am learning HTML and CSS.
            This is my first webpage.
        </p>

        <img src="https://placehold.co/300x200"
             alt="Sample Image">
    </div>

    <div class="container" id="about">
        <h2>About Me</h2>
        <p>I am a Web Development Intern.</p>
    </div>

    <div class="container" id="contact">
        <h2>Contact Form</h2>

        <form onsubmit="event.preventDefault(); alert('Submitted Successfully!');">
            <input type="text"
                   placeholder="Enter Your Name"
                   required>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>

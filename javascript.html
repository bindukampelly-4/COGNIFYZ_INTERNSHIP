<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Tasks</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f4f8;
            padding: 20px;
        }

        h1 {
            color: navy;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            max-width: 400px;
        }

        button {
            padding: 12px;
            background: navy;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 10px;
        }

        input {
            padding: 10px;
            margin: 8px;
            width: 80%;
        }
    </style>
</head>

<body>

    <h1>JavaScript Mini Projects</h1>

    <!-- Task 1: Color Change -->

    <div class="box">
        <h2>1. Color Changing Button</h2>

        <button onclick="changeColor()">
            Click Me
        </button>
    </div>

    <!-- Task 2: Greeting Alert -->

    <div class="box">
        <h2>2. Greeting Message</h2>

        <button onclick="greeting()">
            Show Greeting
        </button>
    </div>

    <!-- Task 3: Calculator -->

    <div class="box">
        <h2>3. Simple Calculator</h2>

        <input type="number" id="num1"
        placeholder="Enter First Number">

        <input type="number" id="num2"
        placeholder="Enter Second Number">

        <button onclick="addNumbers()">
            Add Numbers
        </button>

        <h3 id="result">Result: 0</h3>
    </div>

    <script>

        // Color Changing Button

        function changeColor() {
            let colors = ["red", "green", "blue", "orange"];
            let random = Math.floor(Math.random() * colors.length);

            document.body.style.backgroundColor =
            colors[random];
        }

        // Greeting Alert

        function greeting() {
            let hour = new Date().getHours();
            let message;

            if (hour < 12) {
                message = "Good Morning!";
            }
            else if (hour < 17) {
                message = "Good Afternoon!";
            }
            else {
                message = "Good Evening!";
            }

            alert(message);
        }

        // Addition Calculator

        function addNumbers() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            let sum = a + b;

            document.getElementById("result").innerHTML =
            "Result: " + sum;
        }

    </script>

</body>
</html>

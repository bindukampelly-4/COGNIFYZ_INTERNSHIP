<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Front-end Frameworks</title>

    <!-- Bulma CSS -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f0f4f8;
            font-family: Arial;
        }

        .heading {
            text-align: center;
            color: navy;
            margin: 30px;
        }

        .card {
            max-width: 400px;
            margin: auto;
        }

        .grid-box {
            background: #234e70;
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1 class="heading">Front-end Frameworks</h1>

    <!-- Bulma Responsive Card -->

    <section class="section">
        <h2 class="title has-text-centered">
            Responsive Card
        </h2>

        <div class="card">
            <div class="card-image">
                <figure class="image is-4by3">
                    <img
                    src="https://placehold.co/400x300"
                    alt="Sample Image">
                </figure>
            </div>

            <div class="card-content">
                <p class="title is-4">Web Development</p>

                <p class="content">
                    Learning HTML, CSS, JavaScript
                    and Front-end Frameworks.
                </p>

                <button class="button is-link">
                    Learn More
                </button>
            </div>
        </div>
    </section>


    <!-- Bootstrap Responsive Grid -->

    <section class="container my-5">

        <h2 class="text-center mb-4">
            Responsive Grid Layout
        </h2>

        <div class="row g-3">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="grid-box">
                    <h3>HTML</h3>
                    <p>Webpage Structure</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="grid-box">
                    <h3>CSS</h3>
                    <p>Webpage Styling</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="grid-box">
                    <h3>JavaScript</h3>
                    <p>Webpage Interaction</p>
                </div>
            </div>

        </div>

    </section>

</body>
</html>

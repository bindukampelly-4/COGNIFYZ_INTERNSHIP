<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Responsive Webpage</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
        }

        /* Navigation */

        nav {
            background: navy;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .hamburger {
            display: none;
            color: white;
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Main Content */

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 30px;
            width: 30%;
            min-width: 200px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h1 {
            text-align: center;
            color: navy;
            margin-top: 35px;
        }

        /* Mobile Responsive */

        @media (max-width: 600px) {

            .hamburger {
                display: block;
            }

            .menu {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background: navy;
                padding: 20px;
                text-align: center;
            }

            .menu.active {
                display: flex;
            }

            .box {
                width: 100%;
            }
        }

        /* Tablet Responsive */

        @media (min-width: 601px)
        and (max-width: 900px) {

            .box {
                width: 45%;
            }
        }

    </style>
</head>

<body>

    <!-- Navigation Menu -->

    <nav>

        <div class="logo">My Website</div>

        <button class="hamburger"
        onclick="toggleMenu()">☰</button>

        <div class="menu" id="menu">

            <a href="#home">Home</a>

            <a href="#about">About</a>

            <a href="#services">Services</a>

            <a href="#contact">Contact</a>

        </div>

    </nav>


    <!-- Main Heading -->

    <h1 id="home">Responsive Web Design</h1>

    <div class="container">

        <div class="box" id="about">

            <h2>About Us</h2>

            <p>
                We create responsive and
                user-friendly websites.
            </p>

        </div>


        <div class="box" id="services">

            <h2>Our Services</h2>

            <p>
                HTML, CSS and JavaScript
                Web Development.
            </p>

        </div>


        <div class="box" id="contact">

            <h2>Contact Us</h2>

            <p>
                Welcome to our website!
                Thank you for visiting.
            </p>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        function toggleMenu() {

            let menu = document.getElementById("menu");

            menu.classList.toggle("active");

        }

    </script>

</body>
</html>
